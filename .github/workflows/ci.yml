name: Validate Product

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate content
        id: generate_content
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/generate-task-bank.mjs 2>&1 | tee generate-content.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Fail on content generation error
        if: steps.generate_content.outputs.exit_code != '0'
        run: |
          summary=$(tail -n 20 generate-content.log | tr '\n' ' ' | sed 's/"/\\"/g')
          echo "::error title=Generate content failed::$summary"
          exit 1

      - name: Lint app
        run: ./node_modules/.bin/eslint .

      - name: Run unit tests
        run: ./node_modules/.bin/vitest run

      - name: Validate reviewed content
        run: node scripts/validate-content.mjs

      - name: Build product
        run: node scripts/generate-task-bank.mjs && ./node_modules/.bin/tsc -b && ./node_modules/.bin/vite build

      - name: Smoke check dist output
        run: node scripts/smoke-check.mjs

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser journey tests
        run: node scripts/run-e2e.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
