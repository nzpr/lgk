name: Validate Product

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 45
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Godot toolchain
        uses: actions/cache@v4
        with:
          path: |
            .godot-toolchain
            .godot-home/.local/share/godot/export_templates
          key: godot-4.6.1-stable-${{ runner.os }}

      - name: Validate Godot project
        run: npm run godot:check

      - name: Export Godot Web build
        run: npm run godot:export:web

      - name: Verify Godot Web build
        run: npm run godot:verify:web

      - name: Upload Godot Web artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-build
          path: godot/build/web
          if-no-files-found: ignore
