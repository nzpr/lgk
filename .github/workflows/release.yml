name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Godot toolchain
        uses: actions/cache@v4
        with:
          path: |
            .godot-toolchain
            .godot-home/.local/share/godot/export_templates
          key: godot-4.6.1-stable-${{ runner.os }}

      - name: Validate release candidate
        run: npm run godot:check

      - name: Export release candidate
        run: npm run godot:export:web && npm run godot:verify:web

      - name: Package Godot Web build
        run: tar -C godot/build/web -czf sky-of-many-lanterns-${GITHUB_REF_NAME:-manual}.tar.gz .

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: sky-of-many-lanterns-${{ github.ref_name || 'manual' }}
          path: sky-of-many-lanterns-*.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sky-of-many-lanterns-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
