name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate release candidate
        run: npm run validate

      - name: Package static build
        run: tar -C dist -czf sky-of-many-lanterns-${GITHUB_REF_NAME:-manual}.tar.gz .

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: sky-of-many-lanterns-${{ github.ref_name || 'manual' }}
          path: sky-of-many-lanterns-*.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sky-of-many-lanterns-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
